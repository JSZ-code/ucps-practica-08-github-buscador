name: Publicar React en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Probar adaptador GitHub
        run: npm test
      - name: Compilar frontend
        shell: bash
        run: |
          if [[ "${{ github.event.repository.name }}" == "${{ github.repository_owner }}.github.io" ]]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${{ github.event.repository.name }}/"
          fi
          npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
